name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true

      - run: command -v worker-build || cargo install --locked worker-build@^0.8

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:rust
      - run: npm run typecheck
      - run: npm run test:rust
      - run: npm run build
      - run: npm run build:worker

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: wait for health to serve this commit
        run: |
          deadline=$(( $(date +%s) + 300 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            commit=$(curl -fsS https://bugstack.kattebak.fyi/v1/health | jq -r .commit || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "health serves $commit"
              exit 0
            fi
            echo "health serves ${commit:-nothing}, waiting for $GITHUB_SHA"
            sleep 10
          done
          echo "health did not serve $GITHUB_SHA within 5 minutes"
          exit 1
